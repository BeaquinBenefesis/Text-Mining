<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}miRNA knowledgebase{% endblock %}</title>
  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <link rel="stylesheet" href="/static/style.css?v={{ v }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">miRNA knowledgebase</a>
  {% block header_search %}
  <form class="search" action="/search" method="get">
    <input type="search" name="q" placeholder="miRNA, disease, gene, tissue, pathway, accession&hellip;"
           value="{{ query|default('') }}" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  {% endblock %}
  <div class="header-end">
    {% block header_nav %}<nav class="nav"><a href="/downloads">Downloads</a></nav>{% endblock %}
    <button class="theme-toggle" id="theme-toggle" type="button" hidden></button>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/theme.js?v={{ v }}"></script>
<script src="/static/suggest.js?v={{ v }}"></script>
<script src="/static/timeline.js?v={{ v }}"></script>
<script src="/static/rows.js?v={{ v }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
