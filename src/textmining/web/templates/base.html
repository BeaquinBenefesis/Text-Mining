<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}miRNA knowledgebase{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header>
  <a class="brand" href="/">miRNA knowledgebase</a>
  <form class="search" action="/search" method="get">
    <input type="search" name="q" placeholder="miRNA, disease, tissue, pathway, accession&hellip;"
           value="{{ query|default('') }}" autocomplete="off">
    <button type="submit">Search</button>
  </form>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="/static/timeline.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
